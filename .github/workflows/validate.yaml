name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so toolchain or HACS validation drift surfaces without a push.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: music-flow-card
          path: dist/music-flow-card.js

  hacs:
    # The dist file ships as a GitHub Release asset, so HACS validation can
    # only fully pass once the first tagged release exists. Until then this
    # job is informational: it runs, reports, and does not fail the check.
    name: HACS validation (informational until first release)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
