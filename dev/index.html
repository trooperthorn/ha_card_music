<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>music-flow-card dev harness</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #101014;
        color: #e7e7ea;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toolbar button {
        background: #2c2c31;
        color: #e7e7ea;
        border: 1px solid #3f3f46;
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      .toolbar button.active {
        border-color: #10b981;
      }
      #stage {
        width: min(980px, 100%);
      }
    </style>
  </head>
  <body>
    <div class="toolbar" id="toolbar"></div>
    <div id="stage"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
