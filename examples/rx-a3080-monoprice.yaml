# Reference topology and configuration reference: see README.md.
# Entity ids below are placeholders; replace with your install's real ids.
type: custom:music-flow-card
title: Whole Home Audio

input:
  entity: media_player.music_assistant_living
  name: Music Assistant

channel:
  entity: media_player.chromecast_audio
  name: Chromecast Audio

feed_aliases:
  - AUDIO2
  - Source 2

zones:
  # Yamaha RX-A3080 zones (yamaha_ynca or yamaha_ync). The optional
  # volume.entity readout shows the exact dB from the integration's
  # "Volume (dB)" number entity next to the percent slider.
  - entity: media_player.rx_a3080_main
    name: Great Room
    volume:
      display: db
      entity: number.rx_a3080_main_volume_db
  - entity: media_player.rx_a3080_zone2
    name: Office
    volume:
      display: db
      entity: number.rx_a3080_zone2_volume_db
  - entity: media_player.rx_a3080_zone3
    name: Patio

  # Monoprice zones (unit 1, zones 11 to 16). display: raw shows the
  # amplifier's native 0 to 38 steps next to the percent.
  - entity: media_player.zone_11
    name: Kitchen
    volume:
      display: raw
      max: 38
  - entity: media_player.zone_12
    name: Dining
    volume:
      display: raw
      max: 38
  - entity: media_player.zone_13
    name: Garage
    volume:
      display: raw
      max: 38

# Groups: see README.md "Groups".
groups:
  - entity: media_player.downstairs
    name: Downstairs

# Masters: see README.md "Masters (takeover)".
masters:
  - entity: media_player.unit_1_master
    name: Amp All Zones
    feed_source: Source 2
